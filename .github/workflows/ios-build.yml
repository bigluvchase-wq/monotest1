# Проверочная сборка iOS-приложения: собирается при каждом изменении кода приложения.
# Ничего не подписывает и никуда не отправляет — только показывает, собирается ли проект.
# Готовые сборки для телефона по-прежнему делает Codemagic.
name: iOS build check

on:
  push:
    branches: ['claude/**']
    paths: ['Mono/**', 'Mono.xcodeproj/**', '.github/workflows/ios-build.yml']
  pull_request:
    branches: [main]
    paths: ['Mono/**', 'Mono.xcodeproj/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build for iOS Simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Mono.xcodeproj \
            -scheme Mono \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show errors
        if: failure()
        run: grep -n -B2 -A6 "error:" build.log | head -200 || tail -150 build.log
