 # 1. Собираем проект без требования цифровой подписи
      xcodebuild build \
        -project Mono.xcodeproj \
        -scheme Mono \
        -configuration Release \
        -arch arm64 \
        -sdk iphoneos \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGN_IDENTITY="" \
        CONFIGURATION_BUILD_DIR=build/ios_build
      
      # 2. Вручную упаковываем полученный .app в формат .ipa
      mkdir -p build/Payload
      mv build/ios_build/Mono.app build/Payload/
      cd build
      zip -q -r Mono-unsigned.ipa Payload
artifacts:
  - build/Mono-unsigned.ipa
